name: build csv

on:
  push:
    branches: [main]
    paths:
      - "data/rates/**"
      - "scripts/build-csv.mjs"
      - ".github/workflows/csv.yml"
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; the trigger paths (data/rates) and the commit
# target (data/google) are disjoint, so committing back never re-triggers.
concurrency:
  group: build-csv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-csv.mjs
      - name: Commit CSV if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Another push to main (e.g. the "state: lastId" commit that follows
          # every rates post) can land while this job runs, making our push a
          # non-fast-forward. The CSV is a pure function of data/rates, so on
          # each attempt we sync to the latest main, regenerate, and push again.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-csv.mjs
            if [[ -z "$(git status --porcelain data/google)" ]]; then
              echo "no CSV changes"
              exit 0
            fi
            git add data/google
            git commit -m "csv: buy-usd.csv"
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt), re-syncing and retrying..."
          done
          echo "failed to push after retries" >&2
          exit 1
